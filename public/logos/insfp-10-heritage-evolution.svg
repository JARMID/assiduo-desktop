<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title-10">
  <title id="title-10">INSFP Concept 10 - Modernized Heritage Seal (Ouled Fayet)</title>
  <defs>
    <linearGradient id="gold10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="blue10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="48" fill="#0B111E"/>

  <g transform="translate(128,128)">
    <!-- 1. Upper Vocational Gear Teeth (Golden Arc) -->
    <path d="M -94,-14 
             A 96,96 0 0,1 94,-14 
             L 106,-14 L 102,-32 L 86,-34 
             A 96,96 0 0,0 74,-62 L 88,-74 L 72,-88 L 60,-74 
             A 96,96 0 0,0 32,-86 L 28,-104 L -28,-104 L -32,-86 
             A 96,96 0 0,0 -60,-74 L -72,-88 L -88,-74 L -74,-62 
             A 96,96 0 0,0 -86,-34 L -102,-32 L -106,-14 Z" fill="url(#gold10)"/>

    <!-- 2. Lower Vocational Gear Teeth (Obsidian Arc) -->
    <path d="M -94,14 
             A 96,96 0 0,0 94,14 
             L 106,14 L 102,32 L 86,34 
             A 96,96 0 0,1 74,62 L 88,74 L 72,88 L 60,74 
             A 96,96 0 0,1 32,86 L 28,104 L -28,104 L -32,86 
             A 96,96 0 0,1 -60,74 L -72,88 L -88,74 L -74,62 
             A 96,96 0 0,1 -86,34 L -102,32 L -106,14 Z" fill="#141E33" stroke="#263756" stroke-width="2"/>

    <!-- 3. Inner Center Sky-Blue Lens Disk -->
    <circle cx="0" cy="0" r="72" fill="url(#blue10)"/>

    <!-- 4. Upper Motif: Minimalist Camera & Clapperboard (Vector Icon) -->
    <g transform="translate(0,-38)">
      <!-- Clapper Slate -->
      <rect x="-24" y="-14" width="34" height="22" rx="4" fill="#0B111E"/>
      <!-- Lens Cone -->
      <polygon points="10,-8 24,-16 24,10 10,2" fill="#0B111E"/>
      <!-- Top Clapper Blade -->
      <rect x="-26" y="-20" width="36" height="5" rx="1.5" fill="#FBBF24" transform="rotate(-12 -26 -20)"/>
    </g>

    <!-- 5. Horizontal Gold Separator Bars -->
    <rect x="-106" y="-12" width="212" height="4" rx="2" fill="#FBBF24"/>
    <rect x="-106" y="8" width="212" height="4" rx="2" fill="#FBBF24"/>

    <!-- 6. Center Monogram Bar: "INSFP" rendered as crisp geometric vector shapes -->
    <!-- Center Dark Band -->
    <rect x="-92" y="-8" width="184" height="16" fill="#0B111E"/>
    <!-- Letter I -->
    <rect x="-68" y="-6" width="6" height="12" rx="1" fill="#FFFFFF"/>
    <circle x="0" cx="-57" cy="0" r="1.5" fill="#FBBF24"/>
    <!-- Letter N -->
    <path d="M-50,6 L-50,-6 L-44,-6 L-37,2 L-37,-6 L-32,-6 L-32,6 L-38,6 L-45,-2 L-45,6 Z" fill="#FFFFFF"/>
    <circle x="0" cx="-26" cy="0" r="1.5" fill="#FBBF24"/>
    <!-- Letter S -->
    <path d="M-12,-3 C-12,-5.5 -15,-6 -19,-6 C-24,-6 -25,-4 -25,-2 C-25,1.5 -13,0.5 -13,4 C-13,6 -16,6.5 -19,6.5 C-24,6.5 -25,4.5 -25,3 L-20,3 C-20,4.2 -18,4.5 -19,4.5 C-17,4.5 -15.5,4 -15.5,3 C-15.5,1 -27,1 -27,-2 C-27,-5 -23.5,-6 -19,-6 Z" fill="#FFFFFF"/>
    <circle x="0" cx="-5" cy="0" r="1.5" fill="#FBBF24"/>
    <!-- Letter F -->
    <path d="M2,-6 L18,-6 L18,-2 L8,-2 L8,0 L16,0 L16,3 L8,3 L8,6 L2,6 Z" fill="#FFFFFF"/>
    <circle x="0" cx="24" cy="0" r="1.5" fill="#FBBF24"/>
    <!-- Letter P -->
    <path d="M30,-6 L44,-6 C48,-6 50,-4 50,-1 C50,2 48,4 44,4 L36,4 L36,6 L30,6 Z M36,-2 L42,-2 C44,-2 44.5,-1 44.5,-1 C44.5,-1 44,-0.5 42,-0.5 L36,-0.5 Z" fill="#FFFFFF"/>

    <!-- 7. Lower Motif: Attendance & Digital Pointage Verification Waves -->
    <g transform="translate(0,38)">
      <circle cx="0" cy="0" r="18" fill="#0B111E" stroke="#38BDF8" stroke-width="2"/>
      <!-- Checkmark -->
      <path d="M-8,0 L-2,6 L10,-6" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Subtitle Dots -->
      <circle cx="-28" cy="0" r="2.5" fill="#FBBF24"/>
      <circle cx="28" cy="0" r="2.5" fill="#FBBF24"/>
    </g>
  </g>
</svg>
