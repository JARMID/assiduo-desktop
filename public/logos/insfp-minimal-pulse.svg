<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title-pulse">
  <title id="title-pulse">INSFP Presence - Minimalist Radar Pulse</title>
  <rect width="256" height="256" rx="56" fill="#090D16"/>
  <g transform="translate(128,128)">
    <!-- Outer Sweep Arc -->
    <path d="M-80,0 A80,80 0 1,1 0,80" fill="none" stroke="#1E293B" stroke-width="12" stroke-linecap="round"/>
    <!-- Active Presence Arc -->
    <path d="M-48,-48 A68,68 0 0,1 48,-48" fill="none" stroke="#38BDF8" stroke-width="12" stroke-linecap="round"/>
    <!-- Central Focal Core -->
    <circle cx="0" cy="0" r="28" fill="#111827" stroke="#F59E0B" stroke-width="6"/>
    <!-- Verified Pulse Dot -->
    <circle cx="0" cy="0" r="10" fill="#10B981"/>
    <!-- Precision Target Marks -->
    <line x1="-80" y1="0" x2="-64" y2="0" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
    <line x1="64" y1="0" x2="80" y2="0" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="-80" x2="0" y2="-64" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
