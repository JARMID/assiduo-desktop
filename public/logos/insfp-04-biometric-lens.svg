<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title-04">
  <title id="title-04">INSFP Concept 04 - Biometric Optical Lens</title>
  <defs>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="amber4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="48" fill="#0B111E"/>

  <g transform="translate(128,128)">
    <!-- Lens Outer Barrel Ring -->
    <circle cx="0" cy="0" r="96" fill="none" stroke="#1E293B" stroke-width="6"/>
    <circle cx="0" cy="0" r="86" fill="none" stroke="url(#amber4)" stroke-width="2"/>

    <!-- Focal Notches / Lens Calibration Marks -->
    <line x1="0" y1="-96" x2="0" y2="-86" stroke="#FBBF24" stroke-width="4"/>
    <line x1="96" y1="0" x2="86" y2="0" stroke="#FBBF24" stroke-width="4"/>
    <line x1="0" y1="96" x2="0" y2="86" stroke="#FBBF24" stroke-width="4"/>
    <line x1="-96" y1="0" x2="-86" y2="0" stroke="#FBBF24" stroke-width="4"/>

    <!-- Concentric Biometric Arcs (Fingerprint meets Optical Glass) -->
    <path d="M-64,20 A68,68 0 0,1 64,20" fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>
    <path d="M-50,30 A52,52 0 0,1 50,30" fill="none" stroke="#0284C7" stroke-width="6" stroke-linecap="round"/>
    <path d="M-36,40 A38,38 0 0,1 36,40" fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>
    <path d="M-22,48 A24,24 0 0,1 22,48" fill="none" stroke="#FBBF24" stroke-width="6" stroke-linecap="round"/>

    <!-- Center Camera Sensor / Attendance Pupil -->
    <circle cx="0" cy="-10" r="14" fill="#0B111E" stroke="#38BDF8" stroke-width="4"/>
    <circle cx="0" cy="-10" r="6" fill="#10B981"/>
  </g>
</svg>
