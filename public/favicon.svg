<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title-assiduo">
  <title id="title-assiduo">Assiduo - Attendance &amp; Absence Monitoring Core</title>
  <rect width="256" height="256" rx="56" fill="#0A0E17"/>
  <g transform="translate(128,128)">
    <!-- Outer Register Framework (Square QR Scanning Frame) -->
    <path d="M-68,-32 L-68,-68 L-32,-68" fill="none" stroke="#334155" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M32,-68 L68,-68 L68,-32" fill="none" stroke="#334155" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M68,32 L68,68 L32,68" fill="none" stroke="#334155" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-32,68 L-68,68 L-68,32" fill="none" stroke="#334155" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Attendance Roll-Call Rows (Horizontal Presence Bars) -->
    <!-- Row 1: Session 1 Present (Green Bar) -->
    <rect x="-42" y="-48" width="56" height="12" rx="6" fill="#10B981"/>
    <circle cx="34" cy="-42" r="6" fill="#10B981"/>

    <!-- Row 2: Session 2 Present (Green Bar) -->
    <rect x="-42" y="-20" width="40" height="12" rx="6" fill="#10B981"/>
    <circle cx="34" cy="-14" r="6" fill="#10B981"/>

    <!-- Row 3: Session 3 Absence Alert Slot (Amber Alert Slot) -->
    <rect x="-42" y="8" width="24" height="12" rx="6" fill="#F59E0B"/>
    <circle cx="34" cy="14" r="6" fill="#EF4444"/>

    <!-- Dynamic Validation Checkmark (The Verification Strike across the ledger) -->
    <path d="M-14,24 L10,48 L56,-2" fill="none" stroke="#10B981" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
